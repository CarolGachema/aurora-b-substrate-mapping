<svg viewBox="0 0 1500 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <text x="750" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A1A1A">Aurora B Substrate Mapping Pipeline</text>
  <text x="750" y="56" text-anchor="middle" font-size="13" fill="#555555">Six independent evidence layers, combined into one ranked candidate list</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- connecting arrows -->
  <line x1="230" y1="170" x2="270" y2="170" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="170" x2="520" y2="170" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="170" x2="770" y2="170" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="170" x2="1020" y2="170" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1230" y1="170" x2="1270" y2="170" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 1 -->
  <g>
    <rect x="20" y="90" width="210" height="160" rx="12" fill="#2E5266"/>
    <text x="125" y="120" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#BFD3DE">PHASE 1</text>
    <text x="125" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Motif Mapping</text>
    <text x="125" y="172" text-anchor="middle" font-size="11" fill="#DCE6EA">Data-driven PSSM,</text>
    <text x="125" y="188" text-anchor="middle" font-size="11" fill="#DCE6EA">proteome-wide scan</text>
    <text x="125" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">21,293</text>
    <text x="125" y="238" text-anchor="middle" font-size="11" fill="#DCE6EA">candidates</text>
  </g>

  <!-- Phase 2 -->
  <g>
    <rect x="270" y="90" width="210" height="160" rx="12" fill="#3C8067"/>
    <text x="375" y="120" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#CFE7DC">PHASE 2</text>
    <text x="375" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">TNBC Filtering</text>
    <text x="375" y="172" text-anchor="middle" font-size="11" fill="#E2F1EA">Real tumor</text>
    <text x="375" y="188" text-anchor="middle" font-size="11" fill="#E2F1EA">phosphoproteomics</text>
    <text x="375" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1,482</text>
    <text x="375" y="238" text-anchor="middle" font-size="11" fill="#E2F1EA">validated</text>
  </g>

  <!-- Phase 3 -->
  <g>
    <rect x="520" y="90" width="210" height="160" rx="12" fill="#F2A541"/>
    <text x="625" y="120" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#5C3D0E">PHASE 3</text>
    <text x="625" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#3A2508">Structural Check</text>
    <text x="625" y="172" text-anchor="middle" font-size="11" fill="#4A2F0B">Solvent accessibility,</text>
    <text x="625" y="188" text-anchor="middle" font-size="11" fill="#4A2F0B">experimental structures</text>
    <text x="625" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#3A2508">1 / 25</text>
    <text x="625" y="238" text-anchor="middle" font-size="11" fill="#4A2F0B">confirmed exposed</text>
  </g>

  <!-- Phase 4 -->
  <g>
    <rect x="770" y="90" width="210" height="160" rx="12" fill="#5B7B9A"/>
    <text x="875" y="120" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#DCE6EE">PHASE 4</text>
    <text x="875" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Network Context</text>
    <text x="875" y="172" text-anchor="middle" font-size="11" fill="#E9EFF4">Kinetochore / SAC / CPC</text>
    <text x="875" y="188" text-anchor="middle" font-size="11" fill="#E9EFF4">proximity, hub-filtered</text>
    <text x="875" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">190</text>
    <text x="875" y="238" text-anchor="middle" font-size="11" fill="#E9EFF4">mitotic-proximal</text>
  </g>

  <!-- Phase 5 -->
  <g>
    <rect x="1020" y="90" width="210" height="160" rx="12" fill="#7A9B76"/>
    <text x="1125" y="120" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#E4EEE2">PHASE 5</text>
    <text x="1125" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">CIN Correlation</text>
    <text x="1125" y="172" text-anchor="middle" font-size="11" fill="#EDF4EC">Expression vs. real</text>
    <text x="1125" y="188" text-anchor="middle" font-size="11" fill="#EDF4EC">TCGA aneuploidy score</text>
    <text x="1125" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">92</text>
    <text x="1125" y="238" text-anchor="middle" font-size="11" fill="#EDF4EC">significant (p&lt;0.05)</text>
  </g>

  <!-- Phase 6 -->
  <g>
    <rect x="1270" y="90" width="210" height="160" rx="12" fill="#C0453D"/>
    <text x="1375" y="120" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#F7DAD7">PHASE 6</text>
    <text x="1375" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Composite Rank</text>
    <text x="1375" y="172" text-anchor="middle" font-size="11" fill="#FBEAE8">All evidence layers,</text>
    <text x="1375" y="188" text-anchor="middle" font-size="11" fill="#FBEAE8">standardized &amp; weighted</text>
    <text x="1375" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Final</text>
    <text x="1375" y="238" text-anchor="middle" font-size="11" fill="#FBEAE8">ranked list</text>
  </g>

  <text x="750" y="280" text-anchor="middle" font-size="11" fill="#888888">UniProt · OmniPath · CPTAC · cBioPortal · RCSB PDB / PDBe · EBI QuickGO</text>
</svg>
